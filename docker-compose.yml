# CuraLLM: Phase 1 foundation (PostgreSQL + pgvector, API, mock inference).
# All published ports are bound to 127.0.0.1 only.
name: curallm

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curallm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/setup first)}
      POSTGRES_DB: ${POSTGRES_DB:-curallm}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  inference:
    build: ./services/inference
    environment:
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-mock}
    ports:
      - "127.0.0.1:${INFERENCE_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-curallm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-curallm}
      INFERENCE_URL: http://inference:8001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
