version: 2
updates:
  # GitHub Actions: low risk and verified by CI. One grouped PR, monthly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  # Base images: stay on Python 3.12 until we decide to move.
  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/inference
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Web app: the committed package-lock.json makes npm updates testable in CI.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # pip is intentionally not listed until a Python lockfile exists.
