name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      - name: Lint (syntax errors and pyflakes)
        run: ruff check .
      - name: Shell script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, inference]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  stack-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a CI-only password
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_password_123456/' .env
      - name: Validate the compose file
        run: docker compose config -q
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Apply migrations
        run: bash scripts/migrate.sh
      - name: Verify the running stack
        run: bash scripts/verify.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
