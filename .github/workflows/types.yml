name: Type check (baseline)

# Reports type errors without failing the build. Once the count reaches zero this becomes a required check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the API dependencies and mypy
        run: python3 -m pip install -r services/api/requirements.txt mypy
      - name: Type check the API
        continue-on-error: true
        run: |
          python3 -m mypy --config-file mypy.ini services/api/app | tee mypy-api.txt
      - name: Install the inference dependencies
        run: python3 -m pip install -r services/inference/requirements.txt
      - name: Type check the inference service
        continue-on-error: true
        run: |
          python3 -m mypy --config-file mypy.ini services/inference/app | tee mypy-inference.txt
      - name: Summary
        if: always()
        run: |
          echo "### mypy baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "api: $(tail -n 1 mypy-api.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "inference: $(tail -n 1 mypy-inference.txt)" >> "$GITHUB_STEP_SUMMARY"
